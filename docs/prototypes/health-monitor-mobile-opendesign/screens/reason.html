<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提醒记录详情</title>
  <link rel="stylesheet" href="../shared.css">
</head>
<body class="screen-body">
  <main class="screen-shell">
    <div class="statusbar">
      <span>9:41</span>
      <div class="statusbar-icons">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span class="wifi"><i></i><i></i><i></i></span>
        <span class="battery"><i></i></span>
      </div>
    </div>

    <section class="app-header" data-od-id="reason-header">
      <div>
        <h1>提醒详情</h1>
        <p class="header-copy">把这条提醒出现的时间、内容和原因说清楚。</p>
      </div>
      <span class="header-chip">记录详情</span>
    </section>

    <section class="card" data-od-id="reason-main">
      <div class="detail-stack">
        <div class="detail-row">
          <span class="detail-label">触发时间</span>
          <strong class="detail-value">今天 15:00</strong>
        </div>
        <div class="detail-row">
          <span class="detail-label">提醒文案</span>
          <strong class="detail-value">起身走一走</strong>
        </div>
      </div>

      <div class="card-header" style="margin-top: 18px;">
        <div>
          <span class="nav-pill">触发原因解释</span>
          <h2 class="card-title">下午久坐有点集中</h2>
          <p class="card-subtitle">14:00 到 17:00 基本没起身，所以系统优先提醒你先活动一下。</p>
        </div>
      </div>

      <div class="dense-list" style="margin-top: 14px;">
        <article class="dense-item">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-6-4.35-6-10a3.75 3.75 0 0 1 6-3 3.75 3.75 0 0 1 6 3c0 5.65-6 10-6 10Z"/></svg>
          </span>
          <div class="text-stack">
            <p class="list-title">步数还有补回空间</p>
            <p class="list-meta">今天总活动量不算低，所以先解决久坐比补步数更有效。</p>
          </div>
        </article>

        <article class="dense-item">
          <span class="icon-wrap cool" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="3.5" width="10" height="17" rx="3"/><path d="M10 7h4M9 16h6"/></svg>
          </span>
          <div class="text-stack">
            <p class="list-title">这时提醒更容易做到</p>
            <p class="list-meta">你通常在下午这段时间更愿意接受轻提醒，而不是晚间集中补动作。</p>
          </div>
        </article>
      </div>
    </section>

    <section class="card soft tight" data-od-id="reason-actions">
      <div class="card-header">
        <div>
          <h2 class="card-title">你可以怎么调</h2>
          <p class="card-subtitle">始终保留控制感。</p>
        </div>
      </div>

      <div class="settings-list">
        <article class="settings-item">
          <div class="text-stack">
            <p class="list-title">下次晚一点提醒</p>
            <p class="list-meta">把类似提醒延后 30 分钟。</p>
          </div>
          <span class="chev">›</span>
        </article>

        <article class="settings-item">
          <div class="text-stack">
            <p class="list-title">保持现在的节奏</p>
            <p class="list-meta">继续让系统学习你更舒服的提醒频率。</p>
          </div>
          <span class="chev">›</span>
        </article>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="底部导航">
    <a href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 10.5 12 4l8.5 6.5V20H14v-5h-4v5H3.5z"/></svg>
      <span>首页</span>
    </a>
    <a href="report-list.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      <span>简报</span>
    </a>
    <a href="profile.html" class="active" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.8-3 4.2-4.5 7-4.5s5.2 1.5 7 4.5"/></svg>
      <span>我</span>
    </a>
  </nav>
</body>
</html>
