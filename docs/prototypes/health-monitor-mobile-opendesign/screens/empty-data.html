<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据不足空态</title>
  <link rel="stylesheet" href="../shared.css">
</head>
<body class="screen-body">
  <main class="screen-shell">
    <div class="statusbar">
      <span>9:41</span>
      <div class="statusbar-icons">
        <span class="signal"><i></i><i></i><i></i><i></i></span>
        <span class="wifi"><i></i><i></i><i></i></span>
        <span class="battery"><i></i></span>
      </div>
    </div>

    <section class="app-header" data-od-id="empty-header">
      <div>
        <h1>今天先不下结论</h1>
        <p class="header-copy">信息还不够时，先诚实一点，而不是硬给判断。</p>
      </div>
      <span class="header-chip">空态 / 降级态</span>
    </section>

    <section class="card" data-od-id="empty-main">
      <div class="empty-art">
        <span class="art-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".8" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/></svg>
        </span>
        <div>
          <p class="list-title">还差一点点记录。</p>
          <p class="list-meta" style="margin-top: 8px;">等信息够了，再给你更明确的建议。</p>
        </div>
      </div>

      <div class="trust-list" style="margin-top: 16px;">
        <div class="trust-item">
          <span class="icon-wrap" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16M12 4v16"/></svg>
          </span>
          <div class="text-stack">
            <p class="list-title">为什么先不判断</p>
            <p class="list-meta">太少的信息，不足以给出可信的结论。</p>
          </div>
        </div>

        <div class="trust-item">
          <span class="icon-wrap cool" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-6-4.35-6-10a3.75 3.75 0 0 1 6-3 3.75 3.75 0 0 1 6 3c0 5.65-6 10-6 10Z"/></svg>
          </span>
          <div class="text-stack">
            <p class="list-title">现在还能做什么</p>
            <p class="list-meta">可以补一条主观感受，或者晚一点再回来看。</p>
          </div>
        </div>
      </div>

      <div class="cta-row" style="margin-top: 18px;">
        <button class="btn primary" type="button">补一条感受</button>
        <a class="btn secondary" href="home.html">回首页</a>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="底部导航">
    <a href="home.html" class="active" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 10.5 12 4l8.5 6.5V20H14v-5h-4v5H3.5z"/></svg>
      <span>首页</span>
    </a>
    <a href="report-list.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
      <span>简报</span>
    </a>
    <a href="profile.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.8-3 4.2-4.5 7-4.5s5.2 1.5 7 4.5"/></svg>
      <span>我</span>
    </a>
  </nav>
</body>
</html>
