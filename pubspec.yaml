name: health_monitor
description: 健康监测 App MVP
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  logger: ^2.4.0
  permission_handler: ^12.0.3
  geolocator: ^12.0.0
  sensors_plus: ^6.1.0
  flutter_screenutil: ^5.9.3
  noise_meter: ^5.1.0
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^17.2.2
  path_provider: ^2.1.5
  dio: ^5.7.0
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/icons/common/material_symbols_rounded/
    - assets/illustrations/common/
