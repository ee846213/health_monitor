buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.12.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

group 'plugins.cachet.audio_streamer'
version '1.0-SNAPSHOT'

repositories {
    google()
    mavenCentral()
}

def flutterSdkPath = new Properties().with {
    file("local.properties").withInputStream { load(it) }
    getProperty("flutter.sdk")
}

android {
    namespace 'plugins.cachet.audio_streamer'
    compileSdk 36

    defaultConfig {
        minSdk 19
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.10"
    implementation "androidx.annotation:annotation:1.9.1"
    def flutterJar = files("${flutterSdkPath}/bin/cache/artifacts/engine/android-x64/flutter.jar")
    compileOnly flutterJar
    testImplementation flutterJar
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
